name: Scheduled operations run

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * 1-5'

jobs:
  scheduled-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run operations pipeline
        env:
          PYTHONPATH: .
        run: python run_daily.py

      - name: Upload generated operations outputs
        uses: actions/upload-artifact@v4
        with:
          name: operations-output
          path: |
            data/processed
            data/review
            data/audit
            reports
          if-no-files-found: error
